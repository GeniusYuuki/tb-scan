name: Scrape and Diff

on:
  schedule:
    # 毎日 日本時間の朝9時（UTCの0時）に自動実行する設定
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動で実行できるボタンも有効化

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v3

    - name: Pythonのセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: スクリプトの実行（データ取得）
      run: python scraper.py

    - name: 差分があればコミットしてプッシュ
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        # 変更がある場合のみコミットを作成
        git diff --quiet && git diff --staged --quiet || (git commit -m "データの差分を更新" && git push)
