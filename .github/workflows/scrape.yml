name: Tabelog Scraper

# いつ実行するか（トリガー）の設定
on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分に自動実行
  workflow_dispatch:     # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    
    # データをGitHub上に書き込んで保存するための権限
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🌟 ここが最重要ポイント：beautifulsoup4 が確実に入っています
      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: スクリプトの実行（データ取得）
        run: python scraper.py

      - name: 差分があればコミットしてプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "データを更新"
          git push
